<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Змейка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Змейка</h1>
            <p class="subtitle">Классическая игра</p>
        </header>

        <main>
            <div class="game-info">
                <div class="score">
                    <span>Счёт: <strong id="score">0</strong></span>
                    <span>Рекорд: <strong id="high-score">0</strong></span>
                </div>
                <div class="length">
                    Длина: <strong id="length">1</strong>
                </div>
            </div>

            <div class="game-container">
                <canvas id="gameCanvas" width="400" height="400"></canvas>
                <div class="game-overlay" id="gameOverlay">
                    <h2>Змейка</h2>
                </div>
            </div>

            <div class="controls">
                <div class="buttons">
                    <button id="startBtn">Старт</button>
                    <button id="pauseBtn">Пауза</button>
                    <button id="restartBtn">Сброс</button>
                </div>
                
                <div class="instructions">
                    <p>Управление: Стрелки или WASD</p>
                    <p>Пробел - пауза, Esc - перезапуск</p>
                </div>
            </div>

            <div class="rules">
                <h3>Правила:</h3>
                <ul>
                    <li>Собирайте красные яблоки</li>
                    <li>Избегайте стен и своего хвоста</li>
                    <li>Каждое яблоко 10 очков</li>
                </ul>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
